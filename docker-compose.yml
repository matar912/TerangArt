services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: artisans_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www:cached
      - ./vendor:/var/www/vendor:cached
      - ./node_modules:/var/www/node_modules:cached
    networks:
      - app-network
    environment:
      APP_ENV: local
      APP_DEBUG: true
      DB_HOST: postgres
      DB_PORT: 5432
      DB_DATABASE: artisans_db
      DB_USERNAME: postgres
      DB_PASSWORD: secret
      REDIS_HOST: redis

  nginx:
    image: nginx:latest
    container_name: artisans_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www:cached
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  postgres:
    image: postgres:15
    container_name: artisans_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: artisans_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network

  redis:
    image: redis:alpine
    container_name: artisans_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit
    container_name: artisans_mailpit
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  pgdata:
